name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MPLCONFIGDIR: /tmp/dynamite-mplconfig
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  default-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Show compiler versions
        run: |
          python --version
          gfortran --version
          make --version

      - name: Build Fortran shared library
        run: make -C orblib_fortran shared

      - name: Verify Fortran shared library
        run: |
          test -f orblib_fortran/build/lib/liborblib_fortran.so
          python -c "import ctypes, pathlib; ctypes.CDLL(str(pathlib.Path('orblib_fortran/build/lib/liborblib_fortran.so').resolve()))"

      - name: Install Python package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testing]"
          python -m pip check

      - name: Run shared-library inventory tests
        env:
          DYNAMITE_RUN_ORBLIB_FORTRAN_TESTS: "1"
        run: python -m pytest -v tests/test_fortran_inventory.py

      - name: Run default tests
        run: python -m pytest -v tests

  slow-orblib-output-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make

      - name: Build Fortran shared library
        run: make -C orblib_fortran shared

      - name: Install Python package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[testing]"
          python -m pip check

      - name: Run slow Fortran output tests
        env:
          DYNAMITE_RUN_SLOW_TESTS: "1"
          DYNAMITE_RUN_ORBLIB_FORTRAN_TESTS: "1"
        run: python -m pytest -v tests/test_fortran_orblib_output.py tests/test_fortran_inventory.py
